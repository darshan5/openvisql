name: Release

# Two ways to release, both ending in a published GitHub release with the installers:
#   - Actions > Release > Run workflow, with a version like 0.2.0: bumps the workspace version,
#     commits "chore: release 0.2.0" to main, tags v0.2.0, then builds and publishes.
#   - Push a tag like v0.2.0 yourself (its version must match Cargo.toml).
# Signing is optional: without the secrets below, the macOS app gets an ad-hoc signature
# (no certificate) and the Windows installer is unsigned.
#
# macOS signing and notarization:
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# Windows Authenticode:
#   WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'workflow_dispatch'
      - name: Bump the version, commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 0.2.0, got '$VERSION'"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi
          # The first `version =` in the root manifest is [workspace.package]'s.
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
      - name: Resolve the tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v$VERSION"
          else
            tag="$GITHUB_REF_NAME"
            manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
            if [ "v$manifest" != "$tag" ]; then
              echo "::error::tag $tag doesn't match Cargo.toml version $manifest"; exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, formats: "app,dmg" }
          # The C runtime is linked in, so the installer's app and the portable .exe run
          # without the Visual C++ redistributable.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, formats: "nsis", rustflags: "-C target-feature=+crt-static" }
    runs-on: ${{ matrix.os }}
    env:
      # Step conditions can't read secrets directly, so expose whether they're set.
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Package
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          RUSTFLAGS: ${{ matrix.rustflags }}
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd crates/ovs-app
          # cargo-packager imports the certificate and notarizes from these variables, and takes
          # the signing identity from its config. Only set them when the secrets exist, since
          # missing secrets arrive as empty strings.
          if [ "$RUNNER_OS" = macOS ] && [ "$HAS_APPLE_CERTIFICATE" = true ]; then
            printf 'signing-identity = "%s"\n' "$SECRET_APPLE_SIGNING_IDENTITY" >> Cargo.toml
            export APPLE_CERTIFICATE="$SECRET_APPLE_CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$SECRET_APPLE_CERTIFICATE_PASSWORD"
            if [ -n "$SECRET_APPLE_ID" ]; then
              export APPLE_ID="$SECRET_APPLE_ID" APPLE_PASSWORD="$SECRET_APPLE_PASSWORD" \
                APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
            fi
          elif [ "$RUNNER_OS" = macOS ]; then
            # Ad-hoc signature. Without it only the binary is signed, the bundle isn't sealed,
            # and Gatekeeper reports a downloaded app as "damaged" instead of unverified.
            printf 'signing-identity = "-"\n' >> Cargo.toml
          fi
          cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}

      - name: Add the portable Windows .exe
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        # The app itself, runnable from anywhere without installing (it keeps its settings in
        # %APPDATA%\openvisql like the installed one). Signed with the installer below.
        run: cp "target/${{ matrix.target }}/release/openvisql.exe" "target/packages/openvisql_${TAG#v}_x64-portable.exe"
      - name: Sign the Windows installer
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem target/packages/*.exe | ForEach-Object {
            & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName
          }
          Remove-Item cert.pfx

      - uses: actions/upload-artifact@v4
        with:
          name: openvisql-${{ matrix.target }}
          path: |
            target/packages/*.dmg
            target/packages/*.exe
          if-no-files-found: error

  release:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # A release left as a draft by an earlier run gets the new installers and is published.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --latest --generate-notes --title "OpenViSQL ${TAG#v}"
          fi
