name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Engine crates and live driver tests. The GUI crate is built on macOS/Windows only.
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - { name: mysql, image: "mysql:8.4", env: MYSQL_ROOT_PASSWORD }
          - { name: mariadb, image: "mariadb:11.4", env: MARIADB_ROOT_PASSWORD }
    services:
      db:
        image: ${{ matrix.server.image }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: secret
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -uroot -psecret || mariadb-admin ping -uroot -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p ovs-core -p ovs-mysql -p ovs-store --all-targets
      - run: cargo test -p ovs-core -p ovs-mysql -p ovs-store
        env:
          OVS_TEST_MYSQL: 127.0.0.1:3306:root:secret

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --release -p ovs-app
      - uses: actions/upload-artifact@v4
        with:
          name: openvisql-${{ matrix.os }}
          path: |
            target/release/openvisql
            target/release/openvisql.exe
          if-no-files-found: ignore
