[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/darshan5/openvisql"
authors = ["OpenViSQL contributors"]
rust-version = "1.92"

[workspace.dependencies]
ovs-core = { path = "crates/ovs-core" }
ovs-mysql = { path = "crates/ovs-mysql" }
ovs-ssh = { path = "crates/ovs-ssh" }
ovs-store = { path = "crates/ovs-store" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6"
futures = "0.3"
getrandom = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12", "client_ed25519"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Wire-protocol metadata and settings structs are naturally flag-heavy.
struct_excessive_bools = "allow"
# Declarative UI builders read best as one long chain.
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
